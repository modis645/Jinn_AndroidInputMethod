name: 构建 APK（正式签名）

# 定制 fork 专用：用仓库 secrets 里的自有 keystore 签 release 包，产物可直接安装、可覆盖升级。
# 官方 build-apk.yml 走的是作者自己的密钥 + 硬卡 APK < 5 MB（加了离线语音运行库必然超限），
# 因此定制构建走这条独立工作流：签名材料、口令、别名都由 secrets 注入。
#
# 需要的 secrets（已在本仓库配置）：
#   JINN_KEYSTORE_JKS_BASE64   release keystore 的 base64
#   JINN_KEYSTORE_PASSWORD     密钥库口令
#   JINN_KEY_PASSWORD          密钥口令
#   JINN_KEY_ALIAS             密钥别名
on:
  workflow_dispatch:
    inputs:
      note:
        description: 备注（只写进运行名）
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 写入签名密钥
        env:
          JKS_B64: ${{ secrets.JINN_KEYSTORE_JKS_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$JKS_B64" ] || { echo "缺少 secret: JINN_KEYSTORE_JKS_BASE64"; exit 1; }
          printf '%s' "$JKS_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: 准备离线语音运行库（sherpa-onnx）
        run: |
          set -euo pipefail
          url="https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.20/sherpa-onnx-static-link-onnxruntime-1.12.20.aar"
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/sherpa.aar" "$url"
          mkdir -p "$RUNNER_TEMP/sherpa"
          unzip -q "$RUNNER_TEMP/sherpa.aar" -d "$RUNNER_TEMP/sherpa"
          echo "--- AAR 内容 ---"
          find "$RUNNER_TEMP/sherpa" -maxdepth 2 -type d | head -20
          jar=$(find "$RUNNER_TEMP/sherpa" -name classes.jar | head -1)
          [ -f "$jar" ] || { echo "AAR 里没有 classes.jar"; exit 1; }
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a
          cp "$jar" app/libs/sherpa-onnx.jar
          count=$(find "$RUNNER_TEMP/sherpa" -path '*arm64-v8a*' -name '*.so' | wc -l)
          [ "$count" -ge 1 ] || { echo "AAR 里没有 arm64-v8a 的 .so"; exit 1; }
          find "$RUNNER_TEMP/sherpa" -path '*arm64-v8a*' -name '*.so' -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          ls -l app/libs app/src/main/jniLibs/arm64-v8a

      - name: 编译单元测试（测试与源码脱节时立刻暴露，不再悄悄坏掉）
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon compileDebugUnitTestKotlin

      - name: 跑单元测试（只为记录，不阻塞出包）
        continue-on-error: true
        run: |
          ./gradlew --no-daemon testDebugUnitTest

      - name: 编译 release 包（正式签名）
        env:
          JINN_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          JINN_KEYSTORE_PASSWORD: ${{ secrets.JINN_KEYSTORE_PASSWORD }}
          JINN_KEY_ALIAS: ${{ secrets.JINN_KEY_ALIAS }}
          JINN_KEY_PASSWORD: ${{ secrets.JINN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: 校验产物（签名 + 体积）
        id: apk
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -f "$apk" ] || { echo "缺少 release APK"; exit 1; }
          size=$(stat -c%s "$apk")
          [ "$size" -lt 104857600 ] || { echo "APK 体积超限（>=100MB）: $size"; exit 1; }
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK 未就绪}}"
          apksigner=$(ls -d "$sdk"/build-tools/*/apksigner | grep -E '/[0-9]+(\.[0-9]+)*/apksigner$' | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | head -5
          "$apksigner" verify "$apk" >/dev/null || { echo "签名校验未通过"; exit 1; }
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "体积 $size 字节 / sha256 $sha"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jinn-release-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 90
