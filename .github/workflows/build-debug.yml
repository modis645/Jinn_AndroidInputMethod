name: 构建 APK（debug）

# 定制 fork 专用：不依赖任何签名 secret，用 debug key 自动签名，产物可直接安装。
# 官方 build-apk.yml 走 release 签名（需要 JINN_KEYSTORE_*）并硬卡 APK < 5 MB，
# 加了离线语音运行库后必然超限，因此定制构建走这条独立工作流。
on:
  workflow_dispatch:
    inputs:
      note:
        description: 备注（只写进运行名）
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 编译 debug 包
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: 校验产物
        id: apk
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          [ -f "$apk" ] || { echo "缺少 debug APK"; exit 1; }
          size=$(stat -c%s "$apk")
          [ "$size" -lt 83886080 ] || { echo "APK 体积超限（>=80MB）: $size"; exit 1; }
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "体积 $size 字节 / sha256 $sha"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: jinn-debug-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 60
